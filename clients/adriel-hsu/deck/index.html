<style>

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--border); }
  .topbar .title { font-family: var(--font-display); font-weight: 700; font-size: 14px; }
  .topbar .counter { font-family: var(--font-body); font-size: 12px; color: var(--text-3); }

  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; position: relative; }
  .slide { max-width: 760px; width: 100%; text-align: center; }
  .slide .kicker { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-bottom: 18px; }
  .slide h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(24px, 4vw, 38px); line-height: 1.25; margin-bottom: 24px; }
  .slide ul { list-style: none; text-align: left; max-width: 560px; margin: 0 auto; }
  .slide li { font-size: 17px; color: var(--text-2); padding: 8px 0; }
  .slide li::before { content: "— "; color: var(--gold); }

  .navbar { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 18px 24px; border-top: 1px solid var(--border); }
  .navbar button { background: var(--bg-2); border: 1px solid var(--border-2); color: var(--text); font-family: var(--font-display); font-weight: 700; font-size: 13px; padding: 10px 18px; border-radius: 8px; cursor: pointer; }
  .navbar button:disabled { opacity: 0.35; cursor: default; }
  .navbar button.primary { background: var(--gold); color: #1a1200; border: none; }
  .progress-track { position: absolute; top: 0; left: 0; height: 3px; background: var(--gold); transition: width 0.2s; }
</style>

let i = 0;
function render() {
  const [kicker, heading, bullets] = SLIDES[i];
  document.getElementById('kicker').textContent = kicker;
  document.getElementById('heading').textContent = heading;
  document.getElementById('bullets').innerHTML = bullets.map(b => '<li>' + b + '</li>').join('');
  document.getElementById('counter').textContent = (i+1) + ' / ' + SLIDES.length;
  document.getElementById('prevBtn').disabled = i === 0;
  document.getElementById('nextBtn').textContent = i === SLIDES.length - 1 ? 'End' : 'Next →';
  document.getElementById('nextBtn').disabled = i === SLIDES.length - 1;
  document.getElementById('progress').style.width = ((i+1) / SLIDES.length * 100) + '%';
}
function go(d) {
  const ni = i + d;
  if (ni >= 0 && ni < SLIDES.length) { i = ni; render(); }
}
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});
render();
